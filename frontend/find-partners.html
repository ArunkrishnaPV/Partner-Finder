<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Partners - PartnerFinder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="brand">PartnerFinder</a>
        </div>
    </nav>
    <div class="app-layout">
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="find-partners.html" class="active">Find Partners</a></li>
                <li><a href="requests.html">Requests</a></li>
                <li><a href="connections.html">Connections</a></li>
                <li><a href="profile.html">Profile Settings</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div style="display: flex; gap: var(--spacing-xl);">
                <div class="filter-sidebar">
                    <h3 class="mb-md">Filters</h3>
                    <div class="filter-section">
                        <h4>Department</h4>
                        <select id="filter-dept" class="form-control">
                            <option value="">All Departments</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                        </select>
                    </div>
                    <div class="filter-section">
                        <h4>Year</h4>
                        <select id="filter-year" class="form-control">
                            <option value="">Any Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                    <div class="filter-section">
                        <h4>Partner Type</h4>
                        <select id="filter-type" class="form-control">
                            <option value="">Any Type</option>
                            <option value="Study">Study</option>
                            <option value="Project">Project</option>
                        </select>
                    </div>
                    <button id="apply-filters" class="btn btn-primary" style="width: 100%;">Apply Filters</button>
                </div>
                <div style="flex-grow: 1;">
                    <div class="search-bar">
                        <input type="text" id="search-query" class="form-control" placeholder="Search by subjects, skills, or interests...">
                        <button id="search-btn" class="btn btn-primary">Search</button>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h2 style="margin: 0; font-size: 20px;">Recommended Partners</h2>
                        <span id="results-count" style="color: var(--text-secondary); font-size: 14px;"></span>
                    </div>
                    <div id="results-container">
                        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                            Loading recommendations...
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/supabase-config.js"></script>
    <script type="module" src="js/partners.js"></script>
</body>
</html>

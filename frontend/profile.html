<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile - PartnerFinder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container { max-width: 800px; margin: 40px auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: var(--spacing-xl); box-shadow: var(--shadow-sm); }
        .section-title { font-size: var(--font-size-lg); margin-bottom: var(--spacing-md); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--border-color); color: var(--accent-primary); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); }
        .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: var(--spacing-md); }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-sm); cursor: pointer; }
        .availability-grid { display: grid; grid-template-columns: 100px repeat(3, 1fr); gap: 8px; margin-bottom: var(--spacing-lg); overflow-x: auto; }
        .avail-header { font-weight: var(--font-weight-medium); font-size: var(--font-size-sm); text-align: center; padding: 8px; background-color: var(--bg-tertiary); border-radius: var(--border-radius-sm); }
        .avail-cell { display: flex; justify-content: center; align-items: center; padding: 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); }
        .avail-row-label { font-weight: var(--font-weight-medium); font-size: var(--font-size-sm); display: flex; align-items: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container"><a href="dashboard.html" class="brand">PartnerFinder</a></div>
    </nav>
    <div class="container">
        <div class="profile-container">
            <h2 class="mb-sm">Complete Your Profile</h2>
            <p class="mb-lg">Tell us about yourself to find the best partners.</p>
            <div id="form-message" style="display: none; padding: 12px; border-radius: 4px; margin-bottom: 16px;"></div>
            <form id="profile-form">
                <h3 class="section-title">Academic Details</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">College/University</label>
                        <input type="text" id="college" class="form-control" required placeholder="University Name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select id="department" class="form-control" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science</option>
                            <option value="IT">Information Technology</option>
                            <option value="ECE">Electronics & Communication</option>
                            <option value="EEE">Electrical & Electronics</option>
                            <option value="MECH">Mechanical Engineering</option>
                            <option value="CIVIL">Civil Engineering</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Year of Study</label>
                        <select id="year" class="form-control" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Looking For</label>
                        <select id="partnerType" class="form-control" required>
                            <option value="">Select Partner Type</option>
                            <option value="Study">Study Partner</option>
                            <option value="Project">Project Partner</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                </div>
                <h3 class="section-title mt-md">Subjects & Skills</h3>
                <div class="form-group">
                    <label class="form-label">Subjects (comma separated)</label>
                    <input type="text" id="subjects" class="form-control" placeholder="Data Structures, OS, Database Systems">
                </div>
                <div class="form-group">
                    <label class="form-label">Skills (comma separated)</label>
                    <input type="text" id="skills" class="form-control" placeholder="Python, React, Figma, CAD">
                </div>
                <div class="form-group">
                    <label class="form-label">Interests (comma separated)</label>
                    <input type="text" id="interests" class="form-control" placeholder="Machine Learning, UI/UX, Robotics">
                </div>
                <h3 class="section-title mt-md">Availability</h3>
                <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">Select when you are generally available to collaborate.</p>
                <div class="availability-grid" id="availability-grid">
                    <div></div>
                    <div class="avail-header">Morning</div>
                    <div class="avail-header">Afternoon</div>
                    <div class="avail-header">Evening</div>
                </div>
                <div class="mt-lg">
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                    <a href="dashboard.html" class="btn btn-secondary" style="margin-left: 8px;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/supabase-config.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
